{% extends "public/base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  {% if items %}
    <ul>{% for item in items %}<li><a href="{{ item.href }}">{{ item.title }}</a>{% if item.dates %} <small>{{ item.dates }}</small>{% endif %}</li>{% endfor %}</ul>
  {% else %}
    <p>Nothing published yet.</p>
  {% endif %}
{% endblock %}
