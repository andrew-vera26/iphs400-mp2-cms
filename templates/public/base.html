<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ css_path }}">
</head>
<body>
  <header>
    <a href="{{ home_path }}">{{ site_title }}</a>
    <nav>{% for link in nav %}{% if not loop.first %} · {% endif %}<a href="{{ link.href }}">{{ link.title }}</a>{% endfor %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>Discuss the recaps on <a href="{{ instagram_url }}">Instagram</a>.</small></footer>
</body>
</html>
