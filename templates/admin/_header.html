<form method="post" action="/logout">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  {{ account.name }} ({{ account.role | capitalize }}) <button type="submit">Sign out</button>
</form>
<nav><a href="{{ admin_url() }}">Admin</a> · <a href="{{ admin_url('recaps') }}">Recaps</a>{% if account.role == "admin" %} · <a href="{{ admin_url('trips') }}">Trips</a> · <a href="{{ admin_url('pages') }}">Pages</a> · <a href="{{ admin_url('accounts') }}">Accounts</a>{% endif %}</nav>
{% for message in take_flashes(request) %}<p role="status">{{ message }}</p>{% endfor %}
